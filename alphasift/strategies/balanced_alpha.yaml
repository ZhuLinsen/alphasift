# 均衡多因子策略
name: balanced_alpha
display_name: 均衡多因子
description: 面向中盘活跃股的多因子综合发现，平衡估值、稳定性与量价活跃度（与超大盘红利和极低估值拉开区分）
version: "1.2"
category: framework
tags: [multi_factor, balanced, llm_friendly]
style:
  risk_profile: balanced
  holding_period: watchlist
  execution_style: multi_factor
  market_regime: [neutral, rotation]
  capital_profile: medium_liquidity
  ui_badge: 多因子

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 100000000
    market_cap_min: 5000000000
    market_cap_max: 60000000000
    pe_ttm_min: 12
    pe_ttm_max: 50
    pb_min: 1.5
    pb_max: 6.5
    turnover_rate_min: 1.0
    change_pct_min: -4.0
    change_pct_max: 8.5
    price_min: 3
    price_max: 220
  tech_weight: 0.35
  factor_weights:
    value: 0.24
    activity: 0.20
    stability: 0.18
    liquidity: 0.16
    momentum: 0.12
    reversal: 0.05
    theme_heat: 0.05
  scoring_profile:
    momentum_chase_start_pct: 5.5
    momentum_chase_penalty_slope: 12.0
    activity_ideal_volume_ratio: 2.0
    activity_ideal_turnover_rate: 4.0
    stability_hot_change_pct: 7.0
  risk_profile:
    chase_change_pct: 8.0
    abnormal_volume_ratio: 6.0
    high_turnover_rate: 15.0
  portfolio_profile:
    mode: hard_cap
    max_same_bucket: 1
    concentration_penalty: 4.5
    buckets:
      金融: [券商, 银行, 保险, 多元金融]
      基建航运: [建筑施工, 基础建设, 港口航运, 航运, 铁路, 公路, 物流]
      消费: [白酒, 食品, 家电, 白色家电, 零售, 消费, 酿酒]
      医药: [医药, 中药, 中药生产, 医疗器械, 生物制品, 化学制药]
      科技电子: [半导体, 电子元件, 消费电子, 计算机软件, AI算力, 通信设备, 光模块]
      新能源: [新能源, 光伏, 锂电, 电池, 储能, 输变电设备]
      周期资源: [钢铁, 煤炭, 有色, 稀有金属, 基本金属, 贵金属, 化工, 石油天然气, 化学原料]
      公用事业: [电力, 燃气, 水务, 环保, 公用事业]
  scorecard_profile:
    value_quality_bonus: 2.2
    capital_confirmed_bonus: 1.8
    volume_spike_ratio: 5.5
    hot_money_penalty: 2.2
  ranking_hints: |
    优先关注：
    1. 多个维度都不差的候选，而不是单一指标极端突出
    2. LLM 需要比较候选的风格差异，避免最终名单过度集中在同一逻辑
    3. 对估值、资金、趋势、风险之间的冲突给出清楚解释
  max_output: 5
