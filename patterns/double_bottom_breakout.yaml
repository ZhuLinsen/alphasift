name: double_bottom_breakout
display_name: 双底突破
family: bottom_reversal
status: experimental
version: "1.0"
description: 前期下跌后形成左右双底并伴随足够颈线高度，放量阳线突破颈线阻力
tags: [bottom_reversal, structural, breakout]
market_scope: [cn]
min_history_days: 65

universe:
  exclude_st: true
  proxy_amount_min: 80000000
  close_min: 2.0

mode: direct
conditions:
  - feature: double_bottom_neckline_breakout
    equals: true
    params:
      prior_decline_min_pct: 12.0
      trough_diff_max_atr: 1.2
      min_trough_gap: 7
      neckline_min_atr: 1.5
      neckline_min_pct: 5.0
      breakout_max_overshoot_atr: 2.2
  - feature: pos_in_60d
    min: 0.20
    max: 0.85
  - feature: vol_ratio_20d
    min: 1.3
  - feature: body_atr
    min: 0.6
  - feature: ret_limit_ratio
    min: 0.20
    max: 0.99
  - feature: close_pos_in_bar
    min: 0.55
