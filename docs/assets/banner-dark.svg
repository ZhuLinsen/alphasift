      <line x1="208" y1="76" x2="208" y2="108" stroke="#f87171"/><rect x="203" y="81" width="10" height="19" rx="1.5" fill="#f87171" fill-opacity="0.8"/>
      <line x1="242" y1="74" x2="242" y2="96" stroke="#34d399"/><rect x="237" y="79" width="10" height="11" rx="1.5" fill="#34d399" fill-opacity="0.7"/>
      <line x1="276" y1="64" x2="276" y2="92" stroke="#f87171"/><rect x="271" y="69" width="10" height="17" rx="1.5" fill="#f87171" fill-opacity="0.8"/>
