# 双低选股策略（低 PE + 低 PB）
name: dual_low
display_name: 双低选股
description: 偏稳健的低估值筛选策略，叠加当日活跃度与形态确认，避免长期只命中静态低估值票
version: "1.3"
category: value
tags: [value, defensive, low_valuation, dynamic_signal]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: mean_reversion
  market_regime: [risk_off, range_bound]
  capital_profile: medium_liquidity
  ui_badge: 价值

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 50000000
    pe_ttm_min: 0
    pe_ttm_max: 15
    pb_min: 0
    pb_max: 1.8
    market_cap_min: 5000000000
    market_cap_max: 60000000000
    price_min: 3
    price_max: 80
    change_pct_min: -4.5
    change_pct_max: 4.5
  tech_weight: 0.2
  factor_weights:
    value: 0.34
    stability: 0.20
    liquidity: 0.14
    momentum: 0.10
    activity: 0.10
    reversal: 0.06
    size: 0.06
  scoring_profile:
    momentum_chase_start_pct: 2.5
    momentum_chase_penalty_slope: 18.0
    momentum_downside_start_pct: -2.5
    activity_ideal_volume_ratio: 1.2
    activity_ideal_turnover_rate: 2.0
    activity_high_volume_ratio: 4.0
    activity_high_turnover_rate: 8.0
    stability_hot_change_pct: 4.0
    stability_high_turnover_rate: 8.0
    stability_high_volume_ratio: 4.0
  risk_profile:
    chase_change_pct: 5.0
    abnormal_volume_ratio: 4.0
    high_turnover_rate: 8.0
    low_llm_confidence: 0.45
  portfolio_profile:
    mode: hard_cap
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      金融: [券商, 银行, 保险, 多元金融]
      基建航运: [建筑施工, 基础建设, 港口航运, 航运, 铁路, 公路, 物流]
      消费: [白酒, 食品, 家电, 白色家电, 零售, 消费, 酿酒]
      医药: [医药, 中药, 中药生产, 医疗器械, 生物制品, 化学制药]
      科技电子: [半导体, 电子元件, 消费电子, 计算机软件, AI算力, 通信设备, 光模块]
      新能源: [新能源, 光伏, 锂电, 电池, 储能, 输变电设备]
      周期资源: [钢铁, 煤炭, 有色, 稀有金属, 基本金属, 贵金属, 化工, 石油天然气, 化学原料]
      公用事业: [电力, 燃气, 水务, 环保, 公用事业]
  scorecard_profile:
    value_quality_value_min: 72.0
    value_quality_stability_min: 65.0
    value_quality_bonus: 3.0
    volume_spike_ratio: 4.0
  ranking_hints: |
    优先考虑：
    1. 低 PE / 低 PB 仍是基础，但不要只因为便宜反复选择同一批银行、地产、周期股
    2. 优先选择当日成交活跃度适中、没有追高或破位风险的低估值修复候选
    3. 行业地位、现金流、分红稳定性和近期催化能解释估值修复逻辑
  max_output: 5
