name: three_white_soldiers_pullback
display_name: 红三兵回踩确认
family: trend_continuation
status: experimental
version: "1.0"
description: 出现非涨停稳健红三兵后1-5个交易日回踩不破第三阳开盘支撑，再度放量可控收阳确认（无状态观察/确认）
tags: [trend_continuation, observe_confirm, multi_bar, candlestick]
market_scope: [cn]
min_history_days: 60
cooldown_days: 5

universe:
  exclude_st: true
  proxy_amount_min: 80000000
  close_min: 2.0

mode: observe_confirm
min_wait_days: 1
lookback_days: 5
invalidation:
  rule: close_below_observe_open
  tolerance_atr: 0.3

observe:
  - feature: valid_streak
    min: 4
  - feature: bull_streak
    min: 3
  - feature: close_higher_streak
    min: 2
  - feature: pos_in_60d
    lag: 2
    max: 0.70
  - feature: is_limit_up
    equals: false
  - feature: is_limit_up
    lag: 1
    equals: false
  - feature: is_limit_up
    lag: 2
    equals: false
  - feature: body_limit_ratio
    min: 0.08
    max: 0.55
  - feature: body_limit_ratio
    lag: 1
    min: 0.08
    max: 0.55
  - feature: body_limit_ratio
    lag: 2
    min: 0.08
    max: 0.55
  - feature: ret_3d_limit_ratio
    min: 0.30
    max: 1.05
  - feature: open_in_prev_body
    equals: true
  - feature: open_in_prev_body
    lag: 1
    equals: true
  - feature: upper_shadow_to_range
    max: 0.35
  - feature: upper_shadow_to_range
    lag: 1
    max: 0.35
  - feature: upper_shadow_to_range
    lag: 2
    max: 0.35
  - feature: body_ratio_vs_prev
    min: 0.50
  - feature: body_ratio_vs_prev
    lag: 1
    min: 0.50
  - feature: vol_ratio_20d
    min: 0.8
    max: 2.8

confirm:
  - feature: price_above_ma20
    equals: true
  - feature: is_bull_bar
    equals: true
  - feature: is_limit_up
    equals: false
  - feature: close_above_observe_mid
    equals: true
  - feature: vol_ratio_20d
    max: 1.6
  - feature: ret_limit_ratio
    min: 0.05
    max: 0.55
