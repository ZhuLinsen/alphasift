# 趋势质量策略
name: momentum_quality
display_name: 趋势质量
description: 要求均线多头排列与60日中期主升趋势，结合基本面与活跃度筛选真趋势领涨候选
version: "1.2"
category: framework
tags: [momentum, quality, trend, daily_k, llm_friendly]
style:
  risk_profile: balanced
  holding_period: swing
  execution_style: trend_quality
  market_regime: [risk_on, trend, rotation]
  capital_profile: high_liquidity
  ui_badge: 趋势

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 150000000
    market_cap_min: 6000000000
    market_cap_max: 200000000000
    pe_ttm_min: 15
    pe_ttm_max: 90
    pb_min: 1.5
    pb_max: 12.0
    turnover_rate_min: 1.2
    change_pct_min: -3.5
    change_pct_max: 7.5
    price_min: 4
    price_max: 220
    change_60d_min: 15.0
    change_60d_max: 75.0
    require_ma_bullish: true
    require_price_above_ma20: true
    signal_score_min: 60
  tech_weight: 0.55
  factor_weights:
    momentum: 0.42
    activity: 0.20
    liquidity: 0.14
    stability: 0.10
    theme_heat: 0.08
    value: 0.06
  scoring_profile:
    momentum_chase_start_pct: 5.0
    momentum_chase_penalty_slope: 14.0
    activity_ideal_volume_ratio: 2.2
    activity_ideal_turnover_rate: 4.5
    stability_hot_change_pct: 6.5
  risk_profile:
    chase_change_pct: 7.5
    abnormal_volume_ratio: 5.5
    high_turnover_rate: 14.0
    low_llm_confidence: 0.50
  portfolio_profile:
    mode: hard_cap
    max_same_bucket: 1
    concentration_penalty: 5.0
    buckets:
      金融: [券商, 银行, 保险, 多元金融]
      基建航运: [建筑施工, 基础建设, 港口航运, 航运, 铁路, 公路, 物流]
      消费: [白酒, 食品, 家电, 白色家电, 零售, 消费, 酿酒]
      医药: [医药, 中药, 中药生产, 医疗器械, 生物制品, 化学制药]
      科技电子: [半导体, 电子元件, 消费电子, 计算机软件, AI算力, 通信设备, 光模块]
      新能源: [新能源, 光伏, 锂电, 电池, 储能, 输变电设备]
      周期资源: [钢铁, 煤炭, 有色, 稀有金属, 基本金属, 贵金属, 化工, 石油天然气, 化学原料]
      公用事业: [电力, 燃气, 水务, 环保, 公用事业]
  scorecard_profile:
    value_quality_bonus: 1.8
    capital_confirmed_bonus: 2.4
    volume_spike_ratio: 5.0
    hot_money_penalty: 2.5
  ranking_hints: |
    优先关注：
    1. 已经确认趋势但还没有进入极端追涨阶段的候选
    2. 基本面质量（估值、资金活跃、稳定性）能为趋势提供支撑
    3. 避免单一题材过度集中，兼顾不同风格的趋势机会
  max_output: 5
