name: CN daily data pack

# Build and update the CN unadjusted daily pack (`daily.npz`, `meta.csv.gz`,
# `manifest.json`) inside private GitHub Actions cache (`actions/cache`) only,
# without publishing raw market data to public GitHub Releases.

on:
  workflow_call:
    inputs:
      mode:
        description: "update (incremental with backfill fallback) or backfill (fresh 250d build)"
        required: false
        type: string
        default: "update"
      days:
        description: "Window length in trading days"
        required: false
        type: string
        default: "250"
      trade_date:
        description: "Optional target trade date (YYYY-MM-DD)"
        required: false
        type: string
        default: ""
      source:
        description: "Historical source (auto, yfinance, baostock, daily)"
        required: false
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      mode:
        description: "update (incremental with backfill fallback) or backfill (fresh 250d build)"
        type: choice
        options: [update, backfill]
        default: update
      days:
        description: "Window length in trading days"
        required: false
        default: "250"
      trade_date:
        description: "Optional target trade date (YYYY-MM-DD)"
        required: false
        default: ""
      source:
        description: "Historical source (auto, yfinance, baostock, daily)"
        type: choice
        options: [auto, yfinance, baostock, daily]
        default: auto

permissions:
  contents: read

concurrency:
  group: data-pack-cn
  cancel-in-progress: false

jobs:
  publish-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ALPHASIFT_PACK_DIR: ${{ github.workspace }}/pack
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Restore and save CN daily pack in private Actions cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ALPHASIFT_PACK_DIR }}
          key: cn-daily-pack-${{ github.run_id }}
          restore-keys: |
            cn-daily-pack-

      - name: Build or update CN daily pack
        env:
          TICKPLUS_API_KEY: ${{ secrets.TICKPLUS_API_KEY }}
        run: |
          set -euo pipefail
          mode="${{ inputs.mode || 'update' }}"
          days="${{ inputs.days || '250' }}"
          source="${{ inputs.source || 'auto' }}"
          trade_date="${{ inputs.trade_date || '' }}"
          if [ "$mode" = "update" ] && [ ! -f "$ALPHASIFT_PACK_DIR/manifest.json" ]; then
            mode="backfill"
          fi
          extra_args=(--days "$days" --source "$source")
          if [ -n "$trade_date" ]; then
            extra_args+=(--trade-date "$trade_date")
          fi
          python scripts/build_pack.py "$mode" "${extra_args[@]}"
          rm -rf "$ALPHASIFT_PACK_DIR/.backfill"
          alphasift doctor radar --pack-dir "$ALPHASIFT_PACK_DIR" --explain
