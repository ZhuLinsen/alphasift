name: single_yang_hold
display_name: 单阳不破
family: trend_continuation
status: experimental
version: "1.0"
description: 标志性放量长阳出现后3-6个交易日不跌破大阳开盘价支撑并再度企稳收阳（无状态观察/确认）
tags: [trend_continuation, observe_confirm]
market_scope: [cn]
min_history_days: 60

universe:
  exclude_st: true
  proxy_amount_min: 80000000
  close_min: 2.0

mode: observe_confirm
min_wait_days: 3
lookback_days: 6
invalidation:
  rule: close_below_observe_open
  tolerance_atr: 0.2

observe:
  - feature: body_atr
    min: 1.4
  - feature: ret_limit_ratio
    min: 0.40
    max: 1.05
  - feature: vol_ratio_20d
    min: 1.5
  - feature: close_pos_in_bar
    min: 0.70

confirm:
  - feature: price_above_ma20
    equals: true
  - feature: hold_above_observe_low
    equals: true
  - feature: close_above_observe_mid
    equals: true
  - feature: body_pct
    min: 0.2
  - feature: vol_ratio_20d
    max: 2.0
