[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphasift"
version = "0.2.0"
description = "Full-market stock discovery for AI agents: YAML strategies, optional LLM ranking, sector-diversified picks and T+N evaluation across CN, US, HK, JP, KR, TW and IN"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "efinance>=0.4",
    "akshare>=1.10",
    "baostock>=0.8.9",
    "tushare>=1.4",
    "yfinance>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
alphasift = "alphasift.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["alphasift*"]

[tool.setuptools.package-data]
alphasift = ["strategies/*.yaml"]

[tool.setuptools.data-files]
"." = ["SKILL.md", ".env.example", "LICENSE"]
"agents" = ["agents/openai.yaml"]

[tool.ruff.lint]
# Pinned so every ruff version checks the same rules (newer releases widen
# the default set; CI installs the latest).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Deprecations raised from our own code fail the tests, so pandas-4 breakage
# (e.g. .at adding a column) shows up before pandas 4 ships. Third-party
# deprecations stay warnings.
filterwarnings = [
    "error::DeprecationWarning:alphasift",
    "error::FutureWarning:alphasift",
    "error::DeprecationWarning:(tests\\.)?test_",
    "error::FutureWarning:(tests\\.)?test_",
]
